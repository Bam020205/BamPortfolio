<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Yohanan Times Story card</title>
  <style>
    @font-face { font-family: Playfair; src: url("../media/fonts/playfair.woff2"); font-weight: 100 900; }
    @font-face { font-family: Source; src: url("../media/fonts/source-serif.woff2"); font-weight: 100 900; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #faf9f6; color: #201e1b; padding: 148px 77px 0; }
    header img { display: block; width: 740px; margin: 0 auto 39px; }
    .meta { display: flex; justify-content: space-between; border-top: 4px double #25231e; border-bottom: 1px solid #76736d; padding: 19px 0; font: 23px Arial, sans-serif; letter-spacing: 1px; }
    .cover { display: block; width: calc(100% + 90px); max-height: 500px; margin: 82px -45px 0; object-fit: cover; mix-blend-mode: multiply; }
    .category { margin-top: 73px; font: 600 25px Arial, sans-serif; letter-spacing: 5px; text-transform: uppercase; color: #744633; }
    h1 { margin: 22px 0 19px; font: 600 125px/1.12 Playfair, Georgia, serif; letter-spacing: -.064em; overflow-wrap: anywhere; }
    .byline { font: 29px Source, Georgia, serif; }
    blockquote { margin: 54px 0 0; padding-top: 37px; border-top: 1px solid #99948b; font: 46px/1.3 Source, Georgia, serif; letter-spacing: -.7px; text-wrap: pretty; overflow-wrap: anywhere; }
    .compact .cover { max-height: 350px; margin-top: 56px; }
    .compact .category { margin-top: 48px; }
    .compact blockquote { font-size: 40px; margin-top: 38px; }
    .compact h1 { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 5; overflow: hidden; }
  </style>
</head>
<body>
  <header><img src="../media/yohanan-times.svg" alt="Yohanan Times"><div class="meta"><span id="date"></span><span id="duration"></span></div></header>
  <img class="cover" alt="">
  <div class="category"></div>
  <h1></h1>
  <div class="byline">By Abram Seneca</div>
  <blockquote></blockquote>
</body>
</html>
